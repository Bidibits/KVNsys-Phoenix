# Every project under src/ and every test project under tests/.
packages:
  - src/*
  - tests/*

# pnpm 10 runs no install scripts unless they are listed here.
onlyBuiltDependencies:
  - electron
  - prisma
  - "@prisma/engines"
  - esbuild

# Install scripts deliberately not run: electron-winstaller is electron-builder's tool for the
# Squirrel setup format. KVNsys POS & Inventory's setup file uses NSIS instead.
ignoredBuiltDependencies:
  - electron-winstaller
